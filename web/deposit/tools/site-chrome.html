<!-- The Names Wallet site's shared header and footer, byte for byte from the canonical markup in
     nameswallet-site/partials/README.md (as used by site/android/index.html, merge 12464c7),
     with "Bridge" marked as the current page and the bridge's own footer sentence and links as
     the allowed second <p>/<ul>. tools/chrome.mjs writes these blocks into every page (the
     deposit page's skip link reads "Skip to the deposit"); then the site's
     tools/version-assets.mjs stamps every /assets/ and favicon URL with ?v=<hash>
     (bridge-src/build-source.sh runs all of it). Do not stamp by hand. -->
<template id="ASSETS">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/Inter-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/chrome.css">
</template>
<template id="HEADER">
<a class="site-skip" href="#main">Skip to content</a>
<header class="site-top">
  <div class="site-top-in">
    <a class="site-brand" href="/"><img src="/assets/mark.svg" alt="" width="28" height="28">Names Wallet</a>
    <span class="site-net"><b>Testnet</b><span class="site-net-more">: coins have no value</span></span>
    <nav class="site-nav" aria-label="Main">
      <ul>
        <li><a href="/basecamp/">Basecamp</a></li>
        <li><a href="/android/">Android</a></li>
        <li><a href="/bridge/" aria-current="page">EVM Bridge</a></li>
        <li><a href="/registry/">Registry</a></li>
      </ul>
    </nav>
  </div>
</header>
</template>
