[package]
name = "consensus-guest"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std", "unstable"] }
attest-common = { path = "../../common" }
# Helios consensus-core, unmodified, at tag 0.12.0 (MIT, a16z).
helios-consensus-core = { git = "https://github.com/a16z/helios", rev = "2af9b41887e069144ee56cd710f3ddca195473f8" }
# Same versions Helios 0.12.0 uses; only needed for the breakdown replay (mode 1).
bls12_381 = { version = "0.8.0", features = ["experimental"] }
sha2 = "0.9"
ethereum_ssz = "0.9"
ssz_types = "0.11"
tree_hash = "0.10"
alloy-primitives = "1"

[patch.crates-io]
# RISC Zero accelerated BLS12-381 (bigint2 field ops) for zkcrypto bls12_381 0.8.0.
bls12_381 = { git = "https://github.com/risc0/zkcrypto-bls12_381", tag = "bls12_381/v0.8.0-risczero.1" }
# SHA-256 accelerator: Helios uses sha2 0.9 (proofs, hash-to-curve); tree_hash/ethereum_hashing use 0.10.
sha2-v0-9-9 = { git = "https://github.com/risc0/RustCrypto-hashes", package = "sha2", tag = "sha2-v0.9.9-risczero.0" }
sha2-v0-10-9 = { git = "https://github.com/risc0/RustCrypto-hashes", package = "sha2", tag = "sha2-v0.10.9-risczero.0" }
# Same patch Helios's own workspace applies (always use the sha2 crate).
ethereum_hashing = { git = "https://github.com/ncitron/ethereum_hashing", rev = "7ee70944ed4fabe301551da8c447e4f4ae5e6c35" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
