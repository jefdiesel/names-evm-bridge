[package]
name = "inclusion-guest"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std", "unstable"] }
attest-common = { path = "../../common" }
alloy-trie = { version = "0.9", default-features = false, features = ["ethereum"] }
# keccak256 backend: tiny-keccak (alloy-primitives 1.x defaults to sha3).
alloy-primitives = { version = "1", default-features = false, features = ["tiny-keccak"] }
alloy-rlp = { version = "0.3", default-features = false }

[patch.crates-io]
# Keccak-f accelerator (risc0_keccak_update in risc0-zkvm 3.0.5 guest env).
tiny-keccak = { git = "https://github.com/risc0/tiny-keccak", tag = "tiny-keccak/v2.0.2-risczero.0" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
