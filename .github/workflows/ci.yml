name: CI

# Repository-root workflow. GitHub only reads .github/ at the repository root, so
# vault/.github/workflows/test.yml (left over from `forge init`) never runs; this file replaces it.
# The public copy uses this same file: scripts/export-public.sh copies it unchanged.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_repro_builds:
        description: Run Docker reproducible guest builds (scripts/repro-build.sh + check-image-ids.mjs)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  scripts:
    name: Shell scripts (no early-exit reader of command output)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: lez-bridge/scripts/test-pipe-readers.sh

  # The public-network rows of docs/EVIDENCE.md, replayed from the committed answers
  # (docs/evidence-answers/): no network. Non-blocking; a reviewer runs the live check without --offline.
  evidence:
    name: Evidence re-check (scripts/verify-evidence.sh --offline, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: scripts/verify-evidence.sh --offline docs/evidence-answers

  # VERSIONS.toml against every Cargo.lock/Cargo.toml, the deployment registries, the pinned
  # values in docs and scripts, and its own records (selector vs verifier, control roots, known-bad
  # versions, genesis G2 state). Offline; the on-chain mode (--onchain) runs before a deploy.
  versions:
    name: Version alignment (scripts/check-versions.mjs, offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --version
      - run: node --test scripts/check-versions.test.mjs
      - run: node --test scripts/check-image-ids.test.mjs
      - run: node scripts/check-versions.mjs

  # The public demo's services (RPC filter, faucet, claim relay, attester readers, settlement,
  # outbound updater): stdlib unittest, offline (stand-ins on loopback; real openssl and tar).
  # The updater is not in the public copy, so its test runs where it exists.
  public-demo-python:
    name: Public demo services (python3 -I unittest, offline)
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 --version
      - name: proxy, faucet, relayer, fee_grants, leaves, settle (and updater where present)
        run: |
          set -eu
          failed=0
          for t in proxy/test_proxy.py faucet/test_faucet.py relayer/test_relayer.py \
                   attester/test_fee_grants.py attester/test_leaves.py settle/test_settle.py updater/test_updater.py; do
            f="public-demo/$t"
            if [ ! -f "$f" ] && [ "$t" = updater/test_updater.py ]; then echo "skip $f (not in this copy)"; continue; fi
            echo "::group::$f"
            python3 -I "$f" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"

  vault:
    name: Vault (forge build --sizes, forge test)
    runs-on: ubuntu-latest
    env:
      # foundry.toml [profile.ci]: 1024 fuzz runs, 256 invariant runs x depth 128
      FOUNDRY_PROFILE: ci
    defaults:
      run:
        working-directory: vault
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Foundry (pinned)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - run: forge --version
      # fails if any non-test contract exceeds EIP-170 (BridgeVault is ~22.7 KB)
      - run: forge build --sizes
      # The tests take Anvil's public dev key from Anvil: the repo holds no private key.
      - run: |
          k=$(../lez-bridge/scripts/anvil-dev-key.sh 0)
          echo "::add-mask::$k"
          echo "ANVIL_DEV_KEY_0=$k" >> "$GITHUB_ENV"
      - run: forge test -vv

  # LEZ v0.4.0-rc3 (bafd07be): the tag is pinned in lez-bridge/Cargo.toml and in the tracked locks
  # lez-bridge/Cargo.lock (since 2026-11-14: the one the passing judge-demo run resolved),
  # lez-bridge/release/Cargo.lock, lez-bridge/outbound/Cargo.lock,
  # lez-bridge/outbound-seqsig/Cargo.lock and lez-bridge/reclaim/Cargo.lock.
  lez-programs:
    name: LEZ programs on LEZ v0.4.0-rc3 (cargo test, no zkVM guest build)
    runs-on: ubuntu-latest
    env:
      # None of the crates tested here embeds a guest; this keeps any risc0-build step from
      # needing the RISC Zero toolchain.
      RISC0_SKIP_BUILD: "1"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rust toolchain from lez-bridge/rust-toolchain.toml
        working-directory: lez-bridge
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            lez-bridge
            lez-bridge/release
            lez-bridge/outbound
            lez-bridge/outbound-seqsig
            lez-bridge/reclaim
      - name: Token, bridge and attestation programs (native, LEZ simulator)
        working-directory: lez-bridge
        run: cargo test --locked -j 4 -p bridge_token_core -p bridge_core -p eth_attest_core -p eth_attest -p eth_attest_probe --no-fail-fast
      # Seed-derived secrets (v1 and the Names Wallet app scheme), deposit requests, the recovery scan.
      - name: Bridge client (KDF vectors, recovery scan)
        working-directory: lez-bridge
        run: cargo test --locked -j 4 -p bridge_client --no-fail-fast
      - name: Release statement (release_core, native)
        working-directory: lez-bridge/release
        run: cargo test --locked -j 4 -p release_core
      - name: Outbound statement and claim accumulator (claim_acc, outbound_core, native)
        working-directory: lez-bridge/outbound
        run: cargo test --locked -j 4 -p claim_acc -p outbound_core --all-features --no-fail-fast
      - name: Sequencer-signature checkpoint statement (seqsig_core, native)
        working-directory: lez-bridge/outbound-seqsig
        run: cargo test --locked -j 4 -p seqsig_core --no-fail-fast
      - name: Failsafe reclaim statement (reclaim_core, native)
        working-directory: lez-bridge/reclaim
        run: cargo test --locked -j 4 -p reclaim_core --no-fail-fast

  # Reproducible zkVM guest builds in RISC Zero's digest-pinned Docker builder (M1,
  # docs/REPRODUCIBLE-BUILDS.md). Two clean builds on two fresh runners (no cache of any kind),
  # then a third job compares them byte for byte and checks the ids against VERSIONS.toml.
  repro-guest-builds:
    name: Reproducible guest build ${{ matrix.build }} (Docker, scripts/repro-build.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event_name == 'workflow_dispatch' && inputs.run_repro_builds
    strategy:
      fail-fast: false
      matrix:
        build: [a, b]
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Runner
        run: |
          echo "CPUs $(nproc), memory $(awk '/MemTotal/ {print int($2 / 1048576)}' /proc/meminfo) GB"
          docker version --format 'docker {{.Server.Version}}'
          df -h / | tail -1
          echo "CARGO_DIR=$HOME/.cargo" >> "$GITHUB_ENV"
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - name: Rust toolchain from lez-bridge/rust-toolchain.toml
        working-directory: lez-bridge
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
          rustc --version
      # risc0-build asks rzup for the installed RISC Zero Rust version even for a Docker build (it
      # only picks the `lower-atomic` LLVM pass name by it: any version above 1.81 gives the same
      # flags); the guests themselves compile inside the builder image. Same versions as judge-demo.
      - name: Restore rzup
        id: rzup
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.CARGO_DIR }}/bin/rzup
          key: judge-demo-rzup-0.5.0-${{ runner.os }}-${{ runner.arch }}
      - name: RISC Zero Rust toolchain (rzup 0.5.0, rust 1.97.0)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          [ -x "$CARGO_DIR/bin/rzup" ] || cargo install rzup --version 0.5.0 --locked
          rzup install rust 1.97.0
          rzup show
      - name: Save rzup
        if: steps.rzup.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.CARGO_DIR }}/bin/rzup
          key: judge-demo-rzup-0.5.0-${{ runner.os }}-${{ runner.arch }}
      - name: Build every deployable guest in Docker
        run: |
          start=$(date +%s)
          bash scripts/repro-build.sh --out "$RUNNER_TEMP/out/repro-ids.txt" --elf-dir "$RUNNER_TEMP/out/elf" --jobs "$(nproc)"
          echo "build took $(( $(date +%s) - start )) s"
          docker image ls --digests risczero/risc0-guest-builder
      - uses: actions/upload-artifact@v4
        with:
          name: repro-guests-${{ matrix.build }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error

  repro-guest-compare:
    name: Reproducible guest builds agree and match VERSIONS.toml
    needs: repro-guest-builds
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_repro_builds
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/builds
      - name: Build a equals build b (image ids and ELF sha256)
        run: |
          cd "$RUNNER_TEMP/builds"
          cat repro-guests-a/repro-ids.txt
          diff -u repro-guests-a/repro-ids.txt repro-guests-b/repro-ids.txt
          diff -u repro-guests-a/elf/SHA256SUMS repro-guests-b/elf/SHA256SUMS
          cat repro-guests-a/elf/SHA256SUMS
      - name: Image ids against VERSIONS.toml and the deployment records
        run: node scripts/check-image-ids.mjs --input "$RUNNER_TEMP/builds/repro-guests-a/repro-ids.txt" --verbose
