[package]
name = "lc_bench_fast"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# Spike guest (branch lc-cycles), EXECUTOR ONLY: the whole update verification (Helios's checks,
# unchanged, through the vendored Helios's `verify_generic_update_with` hook) with the signature
# check swapped: Helios's own, zkcrypto from key witnesses, blst from key witnesses with the
# committee bound by its flat hash (today's commitment) or by SSZ branches (committee root).
[workspace]

[dependencies]
eth_attest_core = { path = "../../attest/core" }
lcbench_common = { path = "../../attest/lcbench/common" }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc3" }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std", "unstable"] }
borsh = "1.5.7"
helios-consensus-core = { git = "https://github.com/a16z/helios", rev = "2af9b41887e069144ee56cd710f3ddca195473f8" }
ethereum_ssz = "0.9"
tree_hash = "0.10"
alloy-primitives = { version = "1.7.3", default-features = false }
bls12_381 = { version = "0.8.0", features = ["experimental"] }
sha2 = "0.9"
blst = "=0.3.16"  # exactly the patched fork; a plain "0.3.16" resolved to crates.io 0.3.17 (unaccelerated, 153M)

[patch."https://github.com/a16z/helios"]
helios-consensus-core = { path = "../../attest/vendor/helios-consensus-core" }

[patch.crates-io]
bls12_381 = { git = "https://github.com/risc0/zkcrypto-bls12_381", tag = "bls12_381/v0.8.0-risczero.1" }
sha2-v0-9-9 = { git = "https://github.com/risc0/RustCrypto-hashes", package = "sha2", tag = "sha2-v0.9.9-risczero.0" }
sha2-v0-10-9 = { git = "https://github.com/risc0/RustCrypto-hashes", package = "sha2", tag = "sha2-v0.10.9-risczero.0" }
ethereum_hashing = { git = "https://github.com/ncitron/ethereum_hashing", rev = "7ee70944ed4fabe301551da8c447e4f4ae5e6c35" }
blst = { git = "https://github.com/risc0/blst", tag = "v0.3.16-risczero.0" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
