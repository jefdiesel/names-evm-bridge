[package]
name = "outbound_guest_failsafe"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# M6: the TrustedTip G2-lite guest (same source and features as ../outbound_guest_trusted_tip) plus
# `journal-v2`: it commits `JournalVersion::V2`, the journal `BridgeVaultFailsafe.update` decodes
# (claim accumulator, `woundDown`, `mintStoppedBlock`). The update image of a failsafe vault; a
# different image from the trusted-tip one. Its own workspace.
[workspace]

[[bin]]
name = "outbound_guest_failsafe"
path = "../outbound_guest/src/main.rs"

[dependencies]
outbound_core = { path = "../../outbound/core" }
borsh = "1.5.7"
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["std"] }

[features]
default = ["trusted-tip", "unchecked-private", "journal-v2"]
trusted-tip = ["outbound_core/trusted-tip"]
# As in ../outbound_guest_trusted_tip: private transactions on the sequencer's word.
unchecked-private = []
journal-v2 = ["outbound_core/journal-v2"]

[patch.crates-io]
keccak = { git = "https://github.com/logos-blockchain/sponges", rev = "3a56e99771beedf04946eab21a4a62adc2951377" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
