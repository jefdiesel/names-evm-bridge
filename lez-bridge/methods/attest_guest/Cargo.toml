[package]
name = "attest_guest"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# The RFP-021 attestation program's guest. Its own workspace so its [patch] set (RISC Zero's
# accelerated BLS12-381 and SHA-256, as in attest-spike guest-consensus) never touches the
# bridge workspace. Built only by attest/cycles (executor-only cycle counts) and for deployment.
[workspace]

[dependencies]
eth_attest = { path = "../../attest/program" }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc3" }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }

[patch.crates-io]
# RISC Zero accelerated BLS12-381 (bigint2 field ops) for zkcrypto bls12_381 0.8.0.
bls12_381 = { git = "https://github.com/risc0/zkcrypto-bls12_381", tag = "bls12_381/v0.8.0-risczero.1" }
# SHA-256 accelerator: Helios uses sha2 0.9; tree_hash/ethereum_hashing use 0.10.
sha2-v0-9-9 = { git = "https://github.com/risc0/RustCrypto-hashes", package = "sha2", tag = "sha2-v0.9.9-risczero.0" }
sha2-v0-10-9 = { git = "https://github.com/risc0/RustCrypto-hashes", package = "sha2", tag = "sha2-v0.10.9-risczero.0" }
# Same patch Helios's own workspace applies.
ethereum_hashing = { git = "https://github.com/ncitron/ethereum_hashing", rev = "7ee70944ed4fabe301551da8c447e4f4ae5e6c35" }
# The LEZ keccak patch (keccak 0.2.0) is not applied here: Helios's alloy pulls sha3 0.12, locked
# to keccak 0.2.2, so cargo reported it unused. This guest computes no keccak on any path.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
