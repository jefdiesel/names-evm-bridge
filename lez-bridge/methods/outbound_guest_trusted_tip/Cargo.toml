[package]
name = "outbound_guest_trusted_tip"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# The G2-lite guest with finality::TrustedTip (the host names the final block) and
# `unchecked-private` (private transactions on the sequencer's word, like public ones). Same source
# as ../outbound_guest with those features on, so a different image: a vault whose
# `updateImageId` is this one trusts the LEZ sequencer for finality and for every transaction's
# execution (the demo stage before the light client). Its own workspace.
[workspace]

[[bin]]
name = "outbound_guest_trusted_tip"
path = "../outbound_guest/src/main.rs"

[dependencies]
outbound_core = { path = "../../outbound/core" }
borsh = "1.5.7"
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["std"] }

[features]
default = ["trusted-tip", "unchecked-private"]
trusted-tip = ["outbound_core/trusted-tip"]
# Private transactions extracted without their privacy receipt (outbound_core::update::SequencerTrusted):
# LEZ rc3's receipts are risc0 3.0.5 (GHSA-g6qg-9j8p-7j87), unusable by a 3.1 prover.
unchecked-private = []

[patch.crates-io]
keccak = { git = "https://github.com/logos-blockchain/sponges", rev = "3a56e99771beedf04946eab21a4a62adc2951377" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
