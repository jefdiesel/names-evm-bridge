[package]
name = "seqsig_evidence_guest"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# Contest evidence for the seq-sig gate (branch seq-sig): Ed25519 signatures by keys of the signer
# set over one checkpoint; journal abi.encode(cfgId, signerSetHash, signerBitmap, prevId, prevHash,
# blockId, blockHash). Its own workspace.
[workspace]

[dependencies]
seqsig_core = { path = "../../outbound-seqsig/core" }
borsh = "1.5.7"
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["std"] }

[patch.crates-io]
# RISC Zero's curve25519-dalek 4.1.3 with its bigint accelerator (and the crypto-bigint fork it needs):
# about 0.90M user cycles per Ed25519 verify instead of 3.53M with the stock crate (executor, 2026-11-17,
# public-demo/prove/seq-sig-20261117/README.md). The host verifies with the stock crate; the executor tests in
# outbound-seqsig/host/tests accept and refuse the same witnesses with both builds.
curve25519-dalek = { git = "https://github.com/risc0/curve25519-dalek", rev = "385adda1fa3b66d9aaa8b8fcc99ddc324d33ba32" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", rev = "3ab63a6f1048833f7047d5a50532e4a4cc789384" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
