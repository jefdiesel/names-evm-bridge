[package]
name = "lc_bench_blst"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# Spike guest (branch lc-cycles), EXECUTOR ONLY: the sync-committee signature check on blst through
# RISC Zero's accelerated fork (bigint2 field ops), over the same bytes as lc_bench_zk. No Helios
# and no alloy here, so the fork's `links = "blst"` cannot meet c-kzg's crates.io blst.
# Building it needs a RISC-V C compiler for blst's C (see attest/lcbench/build-lcbench.sh).
[workspace]

[dependencies]
lcbench_common = { path = "../../attest/lcbench/common" }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std", "unstable"] }
borsh = "1.5.7"
blst = "0.3.16"

[patch.crates-io]
blst = { git = "https://github.com/risc0/blst", tag = "v0.3.16-risczero.0" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
