[package]
name = "helios-consensus-core"
version = "0.12.0"
license = "MIT"
# Vendored from a16z/helios @ 2af9b41887e069144ee56cd710f3ddca195473f8 (tag 0.12.0) for the RFP-021
# cycle spike (branch lc-cycles). Changes: `verify_generic_update_with` in consensus_core.rs (patch 1);
# the next committee root by direct SHA-256, `sync_committee_root` in proof.rs (patch 2, public-update).
# Workspace-inherited versions written out from Helios's root Cargo.toml.
edition = "2021"

[dependencies]
# Don't inherit workspace version to not inherit all of the features defined in the workspace
alloy = { version = "2.1.0", default-features = false, features = [
    "consensus",
    "rpc-types",
    "ssz",
    "rlp",
    "k256",
    "eips",
] }
alloy-rlp = "0.3.12"
bls12_381 = { version = "0.8.0", features = ["experimental"] }
ssz_types = "0.11"
ethereum_ssz_derive = "0.9"
ethereum_ssz = "0.9"
tree_hash_derive = "0.10.0"
tree_hash = "0.10.0"
typenum = "1.17.0"
sha2 = "0.9"
eyre = "0.6.8"
serde = { version = "1.0.143", features = ["derive"] }
superstruct = "0.7.0"
thiserror = "1.0.37"
tracing = "0.1.37"

