[package]
name = "attest_cycles"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# EXECUTOR ONLY: runs the attestation, probe and bridge guests in RISC Zero's in-process
# executor (ExecutorImpl) on framed ReceiveInputs and prints user cycles. No prover call exists
# in this crate; the "prove" feature is only what exposes ExecutorImpl (as in attest-spike).
# Its own workspace, so the guest builds and the prover-feature risc0 stay out of lez-bridge.
[workspace]

[dependencies]
eth_attest = { path = "../program" }
eth_attest_core = { path = "../core", features = ["testkit"] }
eth_attest_probe = { path = "../probe" }
bridge_core = { path = "../../bridge" }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc3", features = ["host"] }
risc0-zkvm = { version = "=3.0.5", features = ["prove"] }
helios-consensus-core = { git = "https://github.com/a16z/helios", rev = "2af9b41887e069144ee56cd710f3ddca195473f8" }
ethereum_ssz = "0.9"
borsh = "1.5.7"
serde_json = "1"
hex = "0.4"
anyhow = "1"

[build-dependencies]
risc0-build = "=3.0.5"

[package.metadata.risc0]
methods = ["../../methods/attest_guest", "../../methods/attest_probe_guest", "../../methods/bridge_guest"]

[patch.crates-io]
keccak = { git = "https://github.com/logos-blockchain/sponges", rev = "3a56e99771beedf04946eab21a4a62adc2951377" }

[profile.dev.package.bls12_381]
opt-level = 3
[profile.dev.package.helios-consensus-core]
opt-level = 3
