[package]
name = "eth_attest"
version.workspace = true
edition.workspace = true
license.workspace = true

# The RFP-021 attestation program: instance accounts plus the Helios light-client verification.
# Natively (tests) this uses upstream bls12_381 / sha2; the zkVM guest (methods/attest_guest, its
# own workspace) patches them with RISC Zero's accelerated forks, exactly as the attest-spike did.
[dependencies]
borsh.workspace = true
eth_attest_core.workspace = true
lee_core.workspace = true
risc0-zkvm.workspace = true
# Helios consensus-core 0.12.0 (MIT, a16z), unmodified.
helios-consensus-core = { git = "https://github.com/a16z/helios", rev = "2af9b41887e069144ee56cd710f3ddca195473f8" }
ethereum_ssz = "0.9"
tree_hash = "0.10"
alloy-primitives = { version = "1.7.3", default-features = false }

# The public update path (feature `public-update`): blst, exactly 0.3.16. In the zkVM guest
# (methods/attest_guest_public) it is patched to RISC Zero's accelerated fork, tag
# v0.3.16-risczero.0, which needs RISC Zero's C toolchain; a plain "0.3.16" there resolved to
# crates.io 0.3.17 (unaccelerated, about 153M cycles: research/lc-cycles-2026-11-14.md).
blst = { version = "=0.3.16", optional = true }

[features]
# Spike only (branch lc-cycles): record `env::cycle_count()` at phase boundaries of
# `lc::verify_update` for the attest/lcbench harness. Off in every program build.
cycle-marks = []
# Branch public-update: `Instruction::UpdatePublic`, a finality update verified inside a public
# transaction (blst, key witnesses, Helios's checks through the vendored hook
# `verify_generic_update_with`). Every workspace that enables it must patch Helios to
# attest/vendor/helios-consensus-core (lez-bridge/Cargo.toml, methods/attest_guest_public,
# attest/cycles do). Off in methods/attest_guest, so that guest needs no C toolchain.
public-update = ["dep:blst"]
# TEST ONLY: `Instruction::InitSynthetic` (an instance on a synthetic sync committee, no
# bootstrap). Only in methods/attest_guest_synthetic, a separate, clearly labelled test image.
synthetic-init = ["public-update"]

[dev-dependencies]
lee_core = { workspace = true, features = ["host"] }
eth_attest_core = { workspace = true, features = ["testkit"] }
eth_attest_probe = { path = "../probe" }
eth_consumer = { path = "../consumer" }
sha2 = "0.10"
blst = "=0.3.16"
alloy-trie = { version = "0.9.9", features = ["ethereum", "std"] }
alloy-primitives = { version = "1.7.3", features = ["rlp"] }
alloy-rlp = "0.3.17"
serde_json = "1"
hex = "0.4"
# The consensus-specs light-client vectors (tests/spec_vectors.rs): snappy-framed SSZ and YAML.
snap = "1.1"
serde_yaml = "0.9"
