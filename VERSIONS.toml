# VERSIONS.toml: the one declared truth for every version that must line up.
#
# SPDX-License-Identifier: MIT OR Apache-2.0
#
# `node scripts/check-versions.mjs` reads this file and the real sources (every Cargo.lock and
# Cargo.toml, the deployment registries, the docs and scripts listed under [[pin]], and with
# `--onchain` the contracts on Sepolia) and fails on any disagreement. Rule (AGENTS.md, "Version
# alignment"): no deploy, no pin, no proving run meant for a chain and no dependency bump unless the
# check passes; a bump changes this file in the same commit.
#
# Every value carries its source: `{ v = "...", src = "..." }`. Sources name a file in this
# repository, a crate's own source (crates.io), an on-chain read (date, endpoint) or an advisory.
#
# Format: a strict TOML subset, parsed by the checker itself (no dependencies): [table],
# [[array.of.tables]], key = "string" | 'literal' | integer | true/false | [array] | { inline }.
# One key per line; no multi-line strings or arrays. Any other line is an error.
#
# Roles (fixed names; each workspace below has one or more):
#   lez_chain   the LEZ chain's own verifier (LEZ's own lock; not a workspace here)
#   lez_host    host code that makes or checks receipts for LEZ (the CLI): its recursion circuit
#               (control root) must equal lez_chain's, or LEZ refuses its private claims
#   lez_guests  LEZ programs (bridge, token, attestation, probe guests)
#   eth_guests  guests whose image ids a vault pins (G2-lite outbound, G3 release)
#   eth_provers hosts that prove eth_guests for a vault: their risc0 tuple gives the Groth16
#               selector, which must equal the deployment's verifier selector
#   research    executor-only measurement tools; no receipt goes to any chain
#   none        no risc0 crate allowed

schema = 1
# The deployment the code in this tree builds for: workspace checks compare against its roles.
builds_for = "v5"
# The deployment the module and the deposit page default to.
live = "v5"

[walk]
# Directories the checker never walks for Cargo files (fixtures are test inputs of the checker).
skip = ["scripts/fixtures"]

[lez.rc3]
tag = { v = "v0.4.0-rc3", src = "lez-bridge/Cargo.toml (lee_core tag); AGENTS.md 'LEZ version'" }
commit = { v = "bafd07be0701398f9bc435f73ab05e9a7936c301", src = "git ls-remote logos-execution-zone refs/tags/v0.4.0-rc3 (2026-11-15); lez-bridge/Cargo.lock source line" }

# Control root and BN254 control id of each risc0-circuit-recursion version (the crate's
# src/control_id.rs, ALLOWED_CONTROL_ROOT and BN254_IDENTITY_CONTROL_ID, read 2026-11-15). Two
# versions with one control root accept each other's succinct receipts; across roots they refuse.
[[recursion]]
version = "4.0.4"
control_root = "a54dc85ac99f851c92d7c96d7318af41dbe7c0194edfcc37eb4d422a998c1f56"
bn254_control_id = "c07a65145c3cb48b6101962ea607a4dd93c753bb26975cb47feb00d3666e4404"
src = "risc0-circuit-recursion 4.0.4 src/control_id.rs (crates.io)"

[[recursion]]
version = "4.0.5"
control_root = "a54dc85ac99f851c92d7c96d7318af41dbe7c0194edfcc37eb4d422a998c1f56"
bn254_control_id = "c07a65145c3cb48b6101962ea607a4dd93c753bb26975cb47feb00d3666e4404"
src = "risc0-circuit-recursion 4.0.5 src/control_id.rs (crates.io); vault/DEPLOYMENTS.md v1 verifier checks"

[[recursion]]
version = "4.1.0"
control_root = "e6feef13db7aed4a731c7b0852de1f5c89b137726073f625d05333184d3a551d"
bn254_control_id = "de81d091ba14062acb5023b3b36deee95624e3fd47475cb7ff64aed5f9eac20a"
src = "risc0-circuit-recursion 4.1.0 src/control_id.rs (crates.io); equals the 3.1.0 verifier's CONTROL_ROOT_0/1 read 2026-11-15"

# The Groth16 selector a prover produces: the first 4 bytes of Groth16ReceiptVerifierParameters'
# digest, which hashes the control root, the BN254 control id (risc0-circuit-recursion) and the
# verifying key (risc0-groth16; 3.0.4 and 3.0.5 share one key, 3.0.6 has another). Only tuples
# read from crate source are listed; any other tuple fails as undeclared.
[[prover]]
risc0_zkvm = "3.0.5"
risc0_circuit_recursion = ["4.0.4", "4.0.5"]
risc0_groth16 = ["3.0.4", "3.0.5"]
selector = "0x73c457ba"
params_digest = "73c457ba541936f0d907daf0c7253a39a9c5c427c225ba7709e44702d3c6eedc"
src = "risc0-zkvm 3.0.5 and 3.0.6 src/receipt/groth16.rs test groth16_receipt_verifier_parameters_is_stable; outbound_host ids printed GROTH16_SELECTOR=0x73c457ba (research/outbound-public-measure-2026-11-15.md)"

[[prover]]
risc0_zkvm = "3.1.0"
risc0_circuit_recursion = ["4.1.0"]
risc0_groth16 = ["3.0.6"]
selector = "0xe71e6620"
params_digest = "e71e6620a834f4d8dc1998476b865a9a6437a14474f9442cf8664f9ec22a5eee"
src = "risc0-zkvm 3.1.0 src/receipt/groth16.rs test groth16_receipt_verifier_parameters_is_stable (crates.io, 2026-11-15)"

# Known-bad versions. A hit fails unless an [[accepted]] entry below covers it (then it warns).
# Crate entries apply to the roles that make or check receipts (`roles`): a guest's risc0-zkvm is
# only its guest library, and a receipt's soundness is the prover's and the verifier's (the release
# guest stays on 3.0.5 under the 3.1.0 provers: commit 3d3649a, public-demo/v4/BUILD-outbound.txt).
[[known_bad]]
id = "GHSA-g6qg-9j8p-7j87"
kind = "crate"
crate = "risc0-zkvm"
below = "3.1.0"
roles = ["eth_provers", "lez_host", "lez_chain"]
src = "risc0/risc0 advisory, critical, published 2026-11-11: risc0-zkvm < 3.1.0, risc0-circuit-recursion < 4.1.0, risc0-groth16 < 3.0.6 (gh api repos/risc0/risc0/security-advisories)"

[[known_bad]]
id = "GHSA-g6qg-9j8p-7j87"
kind = "crate"
crate = "risc0-circuit-recursion"
below = "4.1.0"
roles = ["eth_provers", "lez_host", "lez_chain"]
src = "same advisory"

[[known_bad]]
id = "GHSA-g6qg-9j8p-7j87"
kind = "crate"
crate = "risc0-groth16"
below = "3.0.6"
roles = ["eth_provers", "lez_host", "lez_chain"]
src = "same advisory"

[[known_bad]]
id = "GHSA-mm6c-35cm-g4x2"
kind = "verifier"
below = "3.1.0"
src = "risc0/risc0-ethereum advisory, critical, published 2026-11-11: RiscZeroGroth16Verifier.sol < 3.1.0 accepts forged claims"

# Known, accepted misalignments. Each prints as WARN with its reason; nothing passes silently.
# Fields: check (finding class), id (advisory id, optional), deployment / role / workspace / file
# (globs with *, optional); all given fields must match.
[[accepted]]
check = "known-bad"
id = "GHSA-g6qg-9j8p-7j87"
role = "lez_*"
reason = "LEZ v0.4.0-rc3 pins risc0-zkvm 3.0.5 (recursion 4.0.4); the LEZ chain checks these receipts itself and refuses receipts from another control root, so the LEZ side stays on LEZ's version until LEZ moves. No Ethereum verifier checks them."

[[accepted]]
check = "known-bad"
deployment = "v2"
reason = "v2 as deployed (2026-11-13): immutable; its update image is a placeholder, so no receipt can ever be accepted by it."

[[accepted]]
check = "known-bad"
deployment = "v3"
reason = "v3 as deployed (2026-11-14): its verifier is operator-attested (no zk proof checked on chain) and its g2State is zero, so it can take no update."

[[accepted]]
check = "g2-zero"
deployment = "v2"
reason = "v2 as deployed: initialG2State zero, and its update image is a placeholder anyway (vault/DEPLOYMENTS.md)."

[[accepted]]
check = "g2-zero"
deployment = "v3"
reason = "v3 as deployed: initialG2State zero, so it accepts no update and can never release (found 2026-11-15, vault/DEPLOYMENTS.md 'How v3 differs')."

[[accepted]]
check = "control-root"
deployment = "v3"
role = "lez_host"
reason = "lez-bridge.v3 (sha256 40296ea6…, built at c9ec880 with recursion 4.1.0) makes no receipt: it serves v3's public operations only (relay co-sign, root attester, public claims). A PRIVATE claim on v3 needs a CLI on LEZ rc3's recursion 4.0.4: one built from lez-bridge/Cargo.lock since branch lez-host-lock (cli/tests/lez_receipts.rs; the build host's build of 2026-11-15 is sha256 c0e5df01…0c90), never lez-bridge.v3."

[[accepted]]
check = "script-known-bad"
file = "vault/script/SepoliaDeploy.s.sol"
reason = "v2's deploy script, kept as the record: it hard-pins the 3.0.0 verifier. Never use it for a new vault."

