[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]
# Read-only access to the build output, so test/Admin.t.sol (S#8) can list the vault's
# functions from out/BridgeVault.sol/BridgeVault.json. Nothing writes files.
fs_permissions = [{ access = "read", path = "./out" }]
# test/Privacy.t.sol derives its storage-slot allowlist from the artifacts' storage layout.
# (Extra compiler output only; the bytecode is unchanged.)
extra_output = ["storageLayout"]

# Default (local) budget: kept small so a laptop run stays well under a minute.
[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 64
# The handler catches every vault revert itself and counts it; a revert that escapes the
# handler is a handler bug and fails the run.
fail_on_revert = true
show_metrics = true

# CI: what .github/workflows/ci.yml at the repository root runs (FOUNDRY_PROFILE=ci).
[profile.ci.fuzz]
runs = 1024

[profile.ci.invariant]
runs = 256
depth = 128
fail_on_revert = true
show_metrics = true

# Occasional deep run (FOUNDRY_PROFILE=deep forge test); slow, not for every push.
[profile.deep.fuzz]
runs = 10000

[profile.deep.invariant]
runs = 1000
depth = 256
fail_on_revert = true
show_metrics = true
